<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Umbră generală -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feComponentTransfer in="SourceAlpha">
        <feFuncA type="linear" slope="0.7"/>
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feOffset dx="0" dy="6"/>
      <feComposite operator="out" in2="SourceAlpha" result="inverse"/>
      <feFlood flood-color="#000000" result="color"/>
      <feComposite operator="in" in2="inverse" result="shadow"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>

    <!-- Gradient Spate Folder (Gri Mediu) -->
    <linearGradient id="folderBackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Gradient Față Folder (Gri Deschis Definit) -->
    <linearGradient id="folderFrontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="40%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Gradient Interior Folder (Gri Întunecat/Contrast Ridicat) -->
    <linearGradient id="folderInnerDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Gradient Disc CD (Irizații metalice) -->
    <linearGradient id="cdSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="20%" stop-color="#BAE6FD"/>
      <stop offset="40%" stop-color="#FBCFE8"/>
      <stop offset="60%" stop-color="#FEF08A"/>
      <stop offset="80%" stop-color="#C7D2FE"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="cdRainbow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="10%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="35%" stop-color="#F472B6" stop-opacity="0.6"/>
      <stop offset="65%" stop-color="#FACC15" stop-opacity="0.5"/>
      <stop offset="90%" stop-color="#4ADE80" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Gradients HDD -->
    <linearGradient id="hddBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="hddPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Gradients USB Stick (Argintiu Metalic / Aluminiu) -->
    <linearGradient id="usbBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="usbMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <!-- Grup master cu scalare proporțională uniformă (marire ~12%) -->
  <g transform="translate(256, 270) scale(1.12) translate(-256, -260)">
    <!-- ================= 1. SPATE FOLDER ================= -->
    <g id="folder-back" filter="url(#dropShadow)">
      <!-- Urechiușă sus-stânga -->
      <path d="M 28 120 C 28 108, 36 100, 48 100 L 160 100 C 175 100, 185 110, 195 125 L 210 145 L 464 145 C 476 145, 484 153, 484 165 L 484 440 C 484 452, 476 460, 464 460 L 48 460 C 36 460, 28 452, 28 440 Z" fill="url(#folderBackGrad)"/>
      <!-- Interior întunecat (gura folderului) -->
      <rect x="40" y="155" width="432" height="290" rx="12" fill="url(#folderInnerDark)"/>
    </g>

    <!-- ================= 2. ELEMENTE DIN INTERIOR ================= -->

    <!-- A. CD (În stânga, în spatele Stick-ului USB) -->
    <g id="cd-rom" transform="translate(135, 185) rotate(-12)" filter="url(#dropShadow)">
      <!-- Disc exterior -->
      <circle cx="0" cy="0" r="115" fill="url(#cdSurface)"/>
      <circle cx="0" cy="0" r="115" fill="url(#cdRainbow)"/>
      
      <!-- Reflexie speculară pe disc -->
      <path d="M -80 -80 L 80 80 A 115 115 0 0 0 105 40 L -40 -105 A 115 115 0 0 0 -80 -80 Z" fill="#FFFFFF" opacity="0.25"/>

      <!-- Inele centrale CD -->
      <circle cx="0" cy="0" r="42" fill="#E2E8F0" opacity="0.5" stroke="#94A3B8" stroke-width="1"/>
      <circle cx="0" cy="0" r="32" fill="none" stroke="#CBD5E1" stroke-width="3"/>
      <circle cx="0" cy="0" r="22" fill="#FFFFFF" opacity="0.9"/>
      <!-- Gauroiul central -->
      <circle cx="0" cy="0" r="16" fill="#0F172A"/>
    </g>

    <!-- B. HARD DISK HDD (În dreapta) -->
    <g id="hard-disk" transform="translate(340, 190) rotate(8)" filter="url(#dropShadow)">
      <!-- Carcasă principală HDD -->
      <rect x="-85" y="-130" width="170" height="240" rx="14" fill="url(#hddBody)" stroke="#475569" stroke-width="2"/>
      
      <!-- Placă metalică superioară -->
      <rect x="-75" y="-120" width="150" height="220" rx="8" fill="url(#hddPlate)"/>
      <rect x="-70" y="-115" width="140" height="210" rx="6" fill="none" stroke="#CBD5E1" stroke-width="1.5" opacity="0.6"/>

      <!-- Platan disc magnetizat în interiorul HDD -->
      <circle cx="0" cy="-25" r="58" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>
      <circle cx="0" cy="-25" r="50" fill="url(#cdSurface)"/>
      <circle cx="0" cy="-25" r="20" fill="#64748B" stroke="#475569" stroke-width="2"/>
      <circle cx="0" cy="-25" r="8" fill="#0F172A"/>

      <!-- Braț de citire / scriere (Actuator arm) -->
      <path d="M 45 50 L 5 -10 L -2 -8 L 38 55 Z" fill="#CBD5E1" stroke="#475569" stroke-width="1"/>
      <circle cx="45" cy="52" r="9" fill="#94A3B8" stroke="#334155" stroke-width="1.5"/>

      <!-- Etichetă jos HDD -->
      <rect x="-65" y="45" width="130" height="42" rx="4" fill="#F8FAFC"/>
      <!-- Linii text simulate pe etichetă -->
      <line x1="-55" y1="56" x2="-10" y2="56" stroke="#0284C7" stroke-width="3" stroke-linecap="round"/>
      <line x1="-55" y1="66" x2="35" y2="66" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
      <line x1="-55" y1="74" x2="15" y2="74" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Șuruburi colțuri HDD -->
      <circle cx="-68" cy="-113" r="3" fill="#334155"/>
      <circle cx="68" cy="-113" r="3" fill="#334155"/>
      <circle cx="-68" cy="93" r="3" fill="#334155"/>
      <circle cx="68" cy="93" r="3" fill="#334155"/>
    </g>

    <!-- C. STICK USB ARGINTIU (În stânga, ÎN FAȚA CD-ului) -->
    <g id="usb-stick" transform="translate(145, 205) rotate(-6)" filter="url(#dropShadow)">
      <!-- Conector Metalic USB (Capul) -->
      <rect x="-24" y="-135" width="48" height="55" rx="4" fill="url(#usbMetal)" stroke="#64748B" stroke-width="1.5"/>
      <!-- Găuri conector USB -->
      <rect x="-15" y="-120" width="10" height="12" rx="2" fill="#1E293B"/>
      <rect x="5" y="-120" width="10" height="12" rx="2" fill="#1E293B"/>
      <!-- Linii de ghidaj conector interior -->
      <path d="M -20 -90 L 20 -90" stroke="#94A3B8" stroke-width="2"/>

      <!-- Corp Stick USB Argintiu Metalic -->
      <rect x="-34" y="-85" width="68" height="150" rx="14" fill="url(#usbBody)" stroke="#94A3B8" stroke-width="2"/>
      <!-- Insertie / Grip din cauciuc lateral -->
      <rect x="-30" y="-30" width="60" height="65" rx="8" fill="#334155" opacity="0.2"/>

      <!-- LED Indicator activitate -->
      <circle cx="0" cy="40" r="5" fill="#38BDF8"/>
      <circle cx="0" cy="40" r="2" fill="#FFFFFF"/>

      <!-- Ureche agățătoare / breloc jos -->
      <path d="M -16 65 C -16 78, 16 78, 16 65" fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
      <path d="M -10 65 C -10 74, 10 74, 10 65" fill="none" stroke="#1E293B" stroke-width="3"/>
    </g>

    <!-- ================= 3. FAȚĂ FOLDER (BUZUNARUL FRONT) ================= -->
    <g id="folder-front" filter="url(#dropShadow)">
      <!-- Corpul din față al folderului -->
      <path d="M 24 230 
               C 24 218, 34 210, 46 210 
               L 466 210 
               C 478 210, 488 218, 488 230 
               L 472 442 
               C 470 452, 460 460, 448 460 
               L 64 460 
               C 52 460, 42 452, 40 442 
               Z" 
            fill="url(#folderFrontGrad)" 
            stroke="#64748B" 
            stroke-width="1.5"/>

      <!-- Liniar / Buze de sclipire pe marginea superioară a buzunarului -->
      <path d="M 46 211 L 466 211" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

      <!-- Detaliu/Liniat decorativ discret pe folder -->
      <path d="M 50 435 L 462 435" stroke="#64748B" stroke-width="2" opacity="0.4"/>
    </g>
  </g>
</svg>

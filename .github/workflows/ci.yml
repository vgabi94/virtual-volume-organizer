name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install the .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: nuget-

    - name: Restore
      run: dotnet restore VVO.slnx

    - name: Build
      run: dotnet build VVO.slnx -c Release --no-restore

    - name: Test
      run: dotnet test VVO.slnx -c Release --no-build

    # A build of main to download without cutting a tag for it. SourceRevisionId is what the
    # About box reads back as the build's revision.
    - name: Publish a self-contained executable
      if: github.ref == 'refs/heads/main'
      run: >
        dotnet publish VVO.UI/VVO.UI.csproj -c Release -r win-x64 --self-contained true
        -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
        -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false
        -p:SourceRevisionId=${{ github.sha }}
        -o publish/win-x64

    - name: Upload the executable
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: VirtualVolumeOrganizer-win-x64
        path: publish/win-x64/VirtualVolumeOrganizer.exe
        retention-days: 14
